name: Prepare 9Gate R2 transfer
on:
  push:
    branches: [r2-media-upload]
    paths: ['.github/workflows/r2-media-prepare.yml']
permissions: {}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: python -m pip install boto3
      - name: Verify bucket and issue encrypted temporary upload URLs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
