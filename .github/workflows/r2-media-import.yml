name: Upload 9Gate images to R2
on:
  push:
    branches: [r2-media-upload]
    paths: ['.github/workflows/r2-media-import.yml']
permissions: {}
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: python -m pip install boto3
      - name: Verify archives and upload WebP files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          python - <<'PY'
          import concurrent.futures, hashlib, hmac, os, pathlib, re, zipfile
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError

          config = Config(signature_version='s3v4', s3={'addressing_style': 'path'}, max_pool_connections=16, retries={'mode': 'standard', 'total_max_attempts': 5})
          client = boto3.client('s3', endpoint_url=os.environ['R2_ENDPOINT'], region_name='auto', config=config)
          bucket = '9gate-game-media'
          prefix = '_migration/' + hmac.new(os.environ['AWS_SECRET_ACCESS_KEY'].encode(), b'9gate-20261123-v1', hashlib.sha256).hexdigest()
          archives = {
              'base.zip': ('44dbe3fbb65e6bea112645003b2d3ab702e6494149bc9e643d8dd8c9b49152f6', 3397),
              'delta.zip': ('8e6816b2bc8c2f1d628c74793edf5861d1cc3936c878a56600a75ab3ed9929e7', 273),
          }

          def upload(item):
              key, data = item
              if hashlib.sha256(data).hexdigest() != key.removeprefix('game/').removesuffix('.webp'):
                  raise ValueError('Image hash mismatch: ' + key)
              try:
                  client.put_object(Bucket=bucket, Key=key, Body=data, ContentType='image/webp',
                                    CacheControl='public, max-age=31536000, immutable', IfNoneMatch='*')
                  return True
              except ClientError as exc:
                  if exc.response['ResponseMetadata']['HTTPStatusCode'] != 412:
                      raise
                  info = client.head_object(Bucket=bucket, Key=key)
                  if info['ContentLength'] != len(data) or info['ContentType'] != 'image/webp':
                      raise ValueError('Existing object metadata differs: ' + key)
                  return False

          for name, (expected_hash, expected_count) in archives.items():
              try:
                  client.download_file(bucket, prefix + '/' + name, name)
              except ClientError:
                  raise SystemExit('One staging archive is missing or could not be read.')
              with open(name, 'rb') as handle:
                  if hashlib.file_digest(handle, 'sha256').hexdigest() != expected_hash:
                      raise ValueError('Archive digest mismatch: ' + name)
              with zipfile.ZipFile(name) as archive:
                  keys = [key for key in archive.namelist() if re.fullmatch(r'game/[a-f0-9]{64}\.webp', key)]
                  if len(keys) != expected_count or len(set(keys)) != expected_count:
                      raise ValueError('Archive count mismatch: ' + name)
                  with concurrent.futures.ThreadPoolExecutor(max_workers=14) as work:
                      uploaded = sum(work.map(upload, ((key, archive.read(key)) for key in keys)))
              print(f'{name}: verified {expected_count} files, {uploaded} newly uploaded', flush=True)
              pathlib.Path(name).unlink()

          for name in archives:
              client.delete_object(Bucket=bucket, Key=prefix + '/' + name)
          PY
