name: Migrate game screenshots to R2
on:
  push:
    branches: [r2-media-upload]
    paths: ['.github/workflows/r2-screenshots.yml']
permissions:
  contents: write
concurrency:
  group: r2-game-screenshots
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r2-media-upload
      - run: python -m pip install boto3 Pillow requests
      - name: Copy screenshots and confirm public URLs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          git fetch --no-tags origin ead88b3c33e6a5164c81b305acc3e5c3ebf3e8df
          git show ead88b3c33e6a5164c81b305acc3e5c3ebf3e8df:src/data/games.json > src/data/games.json
          python .github/scripts/migrate-screenshots-r2.py
      - name: Save proposed URLs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/games.json r2-screenshot-report.json
          git commit -m "Prepare verified CDN URLs for game screenshots"
          git push origin HEAD:refs/heads/r2-media-upload
